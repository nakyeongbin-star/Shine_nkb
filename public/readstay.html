<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read365 리드스테이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap">
<style>
  :root {
    --bg: #f3f8f2;
    --fg: #1f2d26;
    --muted: #6b8078;
    --accent: #2e9d63;
    --ring-bg: rgba(46, 157, 99, 0.12);
    --card: #ffffff;
    --line: rgba(31, 45, 38, 0.08);
    --brand: #f4a08f;   /* Read365 코랄 */
    --ink: #222222;
  }
  body.break { --bg: #fdf5e9; --fg: #3a2c1a; --muted: #8f7658; --accent: #e08a1e; --ring-bg: rgba(224, 138, 30, 0.14); --line: rgba(58, 44, 26, 0.08); }
  body.meal { --bg: #fdf0ec; --fg: #3b2420; --muted: #97716a; --accent: #e0705c; --ring-bg: rgba(224, 112, 92, 0.14); --line: rgba(59, 36, 32, 0.08); }
  body.idle  { --bg: #f2f4f9; --fg: #232838; --muted: #737a90; --accent: #5669b0; --ring-bg: rgba(86, 105, 176, 0.12); --line: rgba(35, 40, 56, 0.08); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 4vh 40px 4vh;
    transition: background 1.2s ease, color 1.2s ease;
    overflow: hidden;
  }

  header { display: flex; flex-direction: column; align-items: center; gap: 0.6vh; }
  .brand { display: flex; align-items: center; gap: 1.2vh; }
  .brand svg { width: 8.4vh; height: 5.5vh; flex: none; }
  .brand-text {
    font-family: "Montserrat", "Pretendard", "Malgun Gothic", sans-serif;
    font-size: 3vh; font-weight: 700; letter-spacing: 0.32em; color: var(--ink);
  }
  .clock {
    display: flex; align-items: center; gap: 0.5em;
    font-size: 3.2vh; line-height: 1; font-variant-numeric: tabular-nums; color: var(--fg);
  }
  .clock-label {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0.42em 0.65em;
    font-family: "Montserrat", "Pretendard", "Malgun Gothic", sans-serif;
    font-size: 0.55em; font-weight: 700; letter-spacing: 0.12em; line-height: 1;
    color: #fff; background: var(--accent); border-radius: 999px;
  }
  .clock-time { text-box: trim-both cap alphabetic; }
  .clock-label > span { text-box: trim-both cap alphabetic; }

  main { display: flex; flex-direction: column; align-items: center; gap: 3vh; }
  .ring-wrap {
    position: relative; width: 56vh; aspect-ratio: 1;
    border-radius: 50%;
    background: var(--card);
    box-shadow: 0 2vh 6vh rgba(0, 0, 0, 0.07);
  }
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .arc { fill: none; stroke-width: 6; stroke-linecap: round; transition: stroke 1.2s, opacity 0.3s; }
  .arc.track { opacity: 0.16; }
  .arc.c-focus { stroke: #2e9d63; }
  .arc.c-break { stroke: #e08a1e; }
  .arc.c-meal { stroke: #e0705c; }
  .ticks line { stroke: var(--muted); stroke-width: 1.2; stroke-linecap: round; opacity: 0.35; }
  .ticks line.major { stroke-width: 2; opacity: 0.6; }
  .ring-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .phase { font-size: 4.4vh; font-weight: 700; color: var(--accent); }
  .remain { font-size: 15vh; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .remain .unit { font-size: 0.4em; font-weight: 400; margin-left: 0.08em; color: var(--muted); }
  .remain .unit.left { font-size: 0.22em; margin-left: 0.4em; }
  .sub { font-size: 2.4vh; color: var(--muted); margin-top: 0.4em; }
  .ring-center > * { max-width: 76%; word-break: keep-all; }

  .rule {
    font-size: 2.8vh;
    padding: 0.6em 1.6em;
    border-radius: 999px;
    background: var(--card);
    box-shadow: 0 0.5vh 2vh rgba(0, 0, 0, 0.05);
    text-align: center;
  }

  .timetable { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .slot {
    font-size: 1.6vh;
    padding: 0.5em 1em;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    text-align: center;
  }
  .slot b { display: block; font-size: 1.1em; color: var(--fg); }
  .slot.meal { background: transparent; border-style: dashed; }
  .slot.done { opacity: 0.4; }
  .slot.now { background: var(--accent); border-color: var(--accent); border-style: solid; color: #fff; }
  .slot.now b { color: #fff; }

  /* ---- 설정 ---- */
  .top-actions { position: fixed; top: 20px; right: 24px; display: flex; gap: 4px; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%;
    border: none; background: transparent; color: var(--muted);
    cursor: pointer; opacity: 0.45; transition: opacity 0.2s, background 0.2s;
    display: grid; place-items: center;
  }
  .icon-btn:hover, .icon-btn:focus-visible { opacity: 1; background: var(--card); }
  .icon-btn svg { width: 24px; height: 24px; }
  .icon-btn .when-full { display: none; }
  :fullscreen .icon-btn .when-full { display: block; }
  :fullscreen .icon-btn .when-normal { display: none; }

  .modal {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(20, 24, 22, 0.35);
    display: grid; place-items: center;
  }
  .modal[hidden] { display: none; }
  .panel {
    background: #fff; color: #1f2d26;
    width: min(380px, calc(100vw - 32px));
    border-radius: 16px; padding: 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    display: flex; flex-direction: column; gap: 18px;
  }
  .panel-head { display: flex; justify-content: space-between; align-items: center; }
  .panel-head h2 { font-size: 18px; }
  .panel-head button { border: none; background: none; font-size: 22px; line-height: 1; color: #6b8078; cursor: pointer; padding: 4px 8px; }
  .group { display: flex; flex-direction: column; gap: 8px; }
  .group-label { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #8a978f; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .panel button.opt {
    background: #f3f6f4; color: #1f2d26;
    border: 1px solid #e3e9e5; border-radius: 10px;
    padding: 10px 12px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .panel button.opt:hover { background: #e8efeb; }
  .panel button.opt.off { background: #fbe9e6; border-color: #f2c9c1; }
  .volume { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .volume input { flex: 1; accent-color: #2e9d63; }
  .volume output { width: 3em; text-align: right; font-variant-numeric: tabular-nums; color: #6b8078; }
  .hint { font-size: 12px; color: #8a978f; line-height: 1.5; }
  .panel { max-height: calc(100vh - 40px); overflow-y: auto; }
  .field { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .field > .label { width: 3em; flex: none; color: #4a5a52; }
  .field.top { align-items: flex-start; }
  .field.top > .label { padding-top: 8px; }
  .panel input[type="date"], .panel select {
    font: inherit; font-size: 14px; color: #1f2d26;
    border: 1px solid #d9e2dc; border-radius: 8px; padding: 6px 8px; background: #fff;
  }
  .panel input[type="date"] { flex: 1; }
  .meals { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .meal-row { display: flex; align-items: center; gap: 6px; }
  .meal-row .until { color: #8a978f; font-variant-numeric: tabular-nums; }
  .meal-row button, .link {
    border: none; background: none; color: #8a978f; cursor: pointer; font: inherit; font-size: 13px; padding: 4px 6px;
  }
  .meal-row button:hover, .link:hover { color: #1f2d26; }
  .meals .empty { color: #8a978f; font-size: 13px; padding-top: 7px; }
  .panel button.opt.primary { background: #2e9d63; border-color: #2e9d63; color: #fff; font-weight: 700; }
  .panel button.opt.primary:hover { background: #268454; }
  .panel button.opt.small { padding: 6px 10px; font-size: 13px; align-self: flex-start; }
  .msg { font-size: 13px; min-height: 1.2em; }
  .msg.ok { color: #2e9d63; }
  .msg.err { color: #c8503c; }

  #overlay {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(6px);
    color: #1f2d26;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; cursor: pointer; text-align: center;
  }
  #overlay svg { width: 182px; height: 120px; }
  #overlay h1 { font-size: 56px; }
  #overlay p { color: #6b8078; font-size: 20px; line-height: 1.6; }
  #overlay .go {
    background: #2e9d63; color: #fff; font-weight: 700;
    padding: 0.8em 2.2em; border-radius: 999px; font-size: 24px;
    box-shadow: 0 8px 24px rgba(46, 157, 99, 0.3);
  }
  body.ringing .ring-wrap { animation: pulse 1s ease-in-out 4; }
  @keyframes pulse { 50% { transform: scale(1.03); } }
  @media (prefers-reduced-motion: reduce) { body.ringing .ring-wrap { animation: none; } }
</style>
</head>

      <g stroke="#fff" stroke-width="17" stroke-linecap="round">

<div class="top-actions">
<button class="icon-btn" id="btnFull" aria-label="전체화면" title="전체화면">

      <circle class="arc track" id="trackB" cx="100" cy="100" r="92"/>
      <circle class="arc fill" id="fillA" cx="100" cy="100" r="92"/>

<div class="modal" id="settings" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="panel-head">
      <h2 id="settingsTitle">설정</h2>
      <button id="btnClose" aria-label="닫기">×</button>
    </div>
    <div class="group">
      <div class="group-label">종소리 미리 듣기</div>
      <div class="row">
        <button class="opt" id="btnTestStart">🔔 시작종</button>

    <div class="group">

    <div class="group">
      <div class="group-label">행사 일정</div>
      <div class="field">
        <span class="label">날짜</span>
        <input type="date" id="cfgDate">
        <button class="link" id="cfgDateClear" type="button">지우기</button>
      </div>
      <div class="field">
        <span class="label">시간</span>
        <select id="cfgStart" aria-label="시작 시각"></select>
        <span>~</span>
        <select id="cfgEnd" aria-label="종료 시각"></select>
      </div>
      <div class="field top">
        <span class="label">식사</span>
        <div class="meals" id="cfgMeals"></div>
      </div>
      <button class="opt small" id="cfgAddMeal" type="button">+ 식사 시간 추가</button>
      <p class="hint">날짜를 비워두면 타이머와 종이 멈춰요. 식사 시간은 1시간 단위이고 그 시간엔 몰입·종이 쉬어요. 설정은 이 기기(브라우저)에 저장돼요.</p>
      <button class="opt primary" id="cfgApply" type="button">적용</button>
      <p class="msg" id="cfgMsg" role="status"></p>

</div>

<div id="overlay">
  <svg role="img" aria-label="Read365"><use href="#logo"/></svg>
  <h1>리드스테이</h1>
  <p><span id="overlaySummary">매 정각 몰입 시작 · 50분 쉬는 시간</span><br>종소리를 울리려면 화면을 한 번 눌러주세요</p>
  <div class="go">시작하기</div>
</div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const FOCUS_MIN = Number(params.get('focus') ?? 50);

  // ---- 행사 일정 (설정 팝업에서 바꾸고, 이 브라우저에 저장) ----
  // date: 'YYYY-MM-DD' 또는 ''(매일), start/end: 시(정수), meals: [{ hour, name }]
  const DEFAULT_CFG = { date: '', start: 9, end: 18, meals: [{ hour: 12, name: '점심' }] };
  const CFG_KEY = 'readstay-schedule';
  let cfg = DEFAULT_CFG;
  try {
    const saved = JSON.parse(localStorage.getItem(CFG_KEY));
    if (saved && Number.isInteger(saved.start) && Number.isInteger(saved.end) && Array.isArray(saved.meals)) cfg = saved;
  } catch (e) {}

  // 몰입 시간 이름. 바꾸려면 여기만 고치면 됨 (예: n => `${n}번째 스테이`)
  const sessionName = n => `챕터 ${n}`;

  // 테스트용: ?t=08:59:50 처럼 주면 그 시각부터 시계가 흐름
  let offsetMs = 0;
  if (params.get('t')) {
    const [h, m, s = 0] = params.get('t').split(':').map(Number);
    const target = new Date();
    target.setHours(h, m, s, 0);
    offsetMs = target - Date.now();
  }
  const now = () => new Date(Date.now() + offsetMs);

  const pad = n => String(Math.floor(n)).padStart(2, '0');
  const secOfDay = d => d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds() + d.getMilliseconds() / 1000;

  const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
  const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dateLabel = d => `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEKDAYS[d.getDay()]})`;
  const parseDay = key => { const [y, m, dd] = key.split('-').map(Number); return new Date(y, m - 1, dd); };
  // 오늘을 행사 날짜와 비교: -1 이전, 0 당일, 1 이후, null 날짜 미설정(타이머 멈춤)
  const eventDayCompare = d => !cfg.date ? null : Math.sign(dayKey(d).localeCompare(cfg.date));

  // ---- 하루 일정 ----
  // 몰입하는 시간대(시)와 순번. 식사 시간은 빠진다.
  let sessionHours = [];
  const mealAt = h => cfg.meals.find(m => m.hour === h);
  function computeSessions() {
    sessionHours = [];
    for (let h = cfg.start; h < cfg.end; h++) if (!mealAt(h)) sessionHours.push(h);
  }
  computeSessions();
  const sessionNo = h => sessionHours.indexOf(h) + 1;

  // 어떤 시각(시)이 시작될 때 무엇이 오는지
  function whatStartsAt(h) {
    if (h >= cfg.end) return { label: '종료', key: 'after' };
    const meal = mealAt(h);
    if (meal) return { label: `${meal.name}시간`, key: `meal-${h}` };
    return { label: `${sessionName(sessionNo(h))} 시작`, key: `focus-${h}` };
  }

  function getState(d) {
    const h = d.getHours();
    const sec = secOfDay(d);
    const startSec = cfg.start * 3600, endSec = cfg.end * 3600;

    const cmp = eventDayCompare(d);
    if (cmp === null) {
      return { key: 'unset', phase: '날짜를 정해 주세요', remain: null, total: null,
               sub: '⚙ 설정 → 행사 일정에서 날짜를 고르면 시작돼요', rule: '날짜가 없으면 타이머와 종이 쉬어요' };
    }
    if (cmp < 0) {
      const days = Math.round((parseDay(cfg.date) - parseDay(dayKey(d))) / 86400000);
      return { key: 'notyet', phase: `리드스테이 D-${days}`, remain: null, total: null,
               sub: `${dateLabel(parseDay(cfg.date))} ${pad(cfg.start)}:00 시작`, rule: '행사 당일에 타이머가 시작됩니다' };
    }
    if (cmp > 0) {
      return { key: 'after', phase: '리드스테이 종료', remain: null, total: null,
               sub: `${dateLabel(parseDay(cfg.date))} 행사가 끝났어요`, rule: '함께해 주셔서 고맙습니다 👋' };
    }
    if (sec < startSec) {
      return { key: 'before', phase: '시작 전', remain: startSec - sec, total: null,
               sub: `${pad(cfg.start)}:00 ${sessionName(1)} 시작`, rule: '곧 리드스테이가 시작됩니다' };
    }
    if (sec >= endSec) {
      return { key: 'after', phase: '오늘의 리드스테이 종료', remain: null, total: null,
               sub: '함께 머물러 주셔서 고맙습니다', rule: '다음에 또 만나요 👋' };
    }
    const secInHour = sec - h * 3600;
    const next = whatStartsAt(h + 1);
    const meal = mealAt(h);
    if (meal) {
      return { key: `meal-${h}`, type: 'meal', hour: h, phase: `${meal.name}시간`,
               remain: 3600 - secInHour, total: 3600,
               sub: `${pad(h + 1)}:00 ${next.label}`,
               rule: '🍽️ 맛있게 드시고 오세요 · 짐은 두고 가셔도 돼요' };
    }
    const focusSec = FOCUS_MIN * 60;
    const n = sessionNo(h);
    if (secInHour < focusSec) {
      return { key: `focus-${h}`, type: 'focus', hour: h, phase: `${sessionName(n)} 몰입`,
               remain: focusSec - secInHour, total: focusSec,
               sub: `${pad(h)}:${pad(FOCUS_MIN)} 까지`,
               rule: '🤫 대화 없이 몰입 중 · 출입은 조용히 자유롭게' };
    }
    return { key: `break-${h}`, type: 'break', hour: h, phase: '쉬는 시간',
             remain: 3600 - secInHour, total: 3600 - focusSec,
             sub: `${pad(h + 1)}:00 ${next.label}`,
             rule: '☕ 스트레칭 · 물 한 잔 · 대화는 공간 밖에서' };
  }

  // 남은 시간을 차분하게 표시: 분 단위(1분에 한 번만 바뀜).
  // 초는 쉬는 시간 마지막 1분에만 보여준다 (곧 시작한다는 준비 신호).
  function remainParts(st) {
    const sec = Math.ceil(st.remain);
    if (st.type === 'break' && sec <= 60) return [[sec, '초']];
    const min = Math.ceil(sec / 60);
    if (min >= 60) {
      const h = Math.floor(min / 60), m = min % 60;
      return m ? [[h, '시간'], [m, '분']] : [[h, '시간']];
    }
    return [[min, '분']];
  }
  const remainText = st => remainParts(st).map(([n, u]) => n + u).join(' ');
  const remainHtml = st => remainParts(st).map(([n, u]) => `${n}<span class="unit">${u}</span>`).join(' ')
    + '<span class="unit left">남음</span>';

  // ---- 종소리 (Web Audio로 합성, 외부 파일 없음) ----
  let ctx = null, muted = false, volume = 0.7;
  const NOTE = { G4: 392.0, C5: 523.25, D5: 587.33, E5: 659.25 };
  // 학교종 "딩동댕동" (웨스트민스터 차임)
  const START_BELL = ['E5', 'C5', 'D5', 'G4', null, 'G4', 'D5', 'E5', 'C5'];
  const BREAK_BELL = ['C5', 'E5', 'D5', 'G4', null, 'G4', 'D5', 'E5', 'C5'];
  const END_BELL = ['E5', 'C5', 'D5', 'G4', null, 'G4', 'D5', 'E5', 'C5', null, 'C5'];

  try {
    const saved = localStorage.getItem('readstay-volume');
    if (saved !== null) volume = Number(saved) / 100;
  } catch (e) {}

  let pending = [];  // 예약된 종소리 노드 (음소거 시 끊기 위해 보관)

  function strike(freq, t) {
    const master = ctx.createGain();
    master.connect(ctx.destination);
    pending.push(master);
    const peak = Math.max(0.35 * volume, 0.0002);
    master.gain.setValueAtTime(0.0001, t);
    master.gain.exponentialRampToValueAtTime(peak, t + 0.01);
    master.gain.exponentialRampToValueAtTime(0.0001, t + 2.8);
    // 종 특유의 배음
    [[1, 1], [2, 0.5], [2.76, 0.25], [5.4, 0.12]].forEach(([ratio, amp]) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq * ratio;
      g.gain.value = amp;
      osc.connect(g).connect(master);
      osc.start(t);
      osc.stop(t + 3);
    });
  }

  // delaySec 뒤에 울리도록 오디오 시계에 미리 예약한다.
  // 오디오 시계는 탭이 백그라운드여도 느려지지 않아서 종이 정확한 시각에 울린다.
  function playBell(seq, delaySec = 0) {
    if (!ctx || muted || volume === 0) return;
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    let t = ctx.currentTime + Math.max(delaySec, 0) + 0.05;
    seq.forEach(n => {
      if (n) strike(NOTE[n], t);
      t += 0.75;
    });
    setTimeout(() => {
      document.body.classList.add('ringing');
      setTimeout(() => document.body.classList.remove('ringing'), 4000);
    }, Math.max(delaySec, 0) * 1000);
    // 다 울린 노드는 목록에서 정리
    const mine = pending.slice(-seq.filter(Boolean).length);
    setTimeout(() => { pending = pending.filter(g => !mine.includes(g)); }, (t + 3 - ctx.currentTime) * 1000);
  }

  function stopAllBells() {
    pending.forEach(g => g.disconnect());
    pending = [];
    scheduledKey = null;
  }

  // ---- 화면 꺼짐 방지 ----
  let wakeLock = null;
  async function keepAwake() {
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && wakeLock !== null) keepAwake();
  });

  // ---- 시간표 ----
  function buildTimetable() {
    const tt = document.getElementById('timetable');
    tt.innerHTML = '';
    for (let h = cfg.start; h < cfg.end; h++) {
      const el = document.createElement('div');
      el.className = 'slot';
      el.dataset.hour = h;
      const meal = mealAt(h);
      if (meal) {
        el.classList.add('meal');
        el.innerHTML = `<b>${meal.name}</b>${pad(h)}:00–${pad(h + 1)}:00`;
      } else {
        el.innerHTML = `<b>${sessionName(sessionNo(h))}</b>${pad(h)}:00–${pad(h)}:${pad(FOCUS_MIN)}`;
      }
      tt.appendChild(el);
    }
    const summary = document.getElementById('overlaySummary');
    if (summary) {
      const meals = [...cfg.meals].sort((a, b) => a.hour - b.hour).map(m => ` · ${m.hour}시 ${m.name}`).join('');
      summary.textContent = cfg.date
        ? `${dateLabel(parseDay(cfg.date))} ${cfg.start}시~${cfg.end}시 · 매 정각 몰입 시작 · ${FOCUS_MIN}분 쉬는 시간${meals}`
        : '행사 날짜가 아직 없어요 · 시작한 뒤 ⚙ 설정에서 날짜를 정해 주세요';
    }
  }
  buildTimetable();

  // ---- 렌더 루프 ----
  const $ = id => document.getElementById(id);
  const CIRC = 2 * Math.PI * 92;
  let scheduledKey = null;
  const LOOKAHEAD = 70;  // 초. 백그라운드 탭은 타이머가 최대 1분 늦게 돌 수 있어 넉넉히 미리 예약

  // 다음 상태 전환 시각과 그때 울릴 종 (bell이 null이면 종 없이 화면만 바뀜)
  function nextTransition(d) {
    const sec = secOfDay(d);
    const h = d.getHours();
    const startSec = cfg.start * 3600, endSec = cfg.end * 3600;
    if (eventDayCompare(d) !== 0) return { at: Infinity, key: 'not-event-day', bell: null };
    if (sec < startSec) return { at: startSec, key: `focus-${cfg.start}`, bell: START_BELL };
    if (sec >= endSec) return { at: 86400 + startSec, key: 'next-day', bell: null };
    const focusEnd = h * 3600 + FOCUS_MIN * 60;
    if (!mealAt(h) && sec < focusEnd) return { at: focusEnd, key: `break-${h}`, bell: BREAK_BELL };
    const next = whatStartsAt(h + 1);
    const bell = next.key === 'after' ? END_BELL : next.key.startsWith('meal') ? null : START_BELL;
    return { at: (h + 1) * 3600, key: next.key, bell };
  }

  // 원 = 시계처럼 한 시간(60분). 5분마다 눈금, 0·15·30·45분은 굵게.
  (function drawTicks() {
    const g = $('ticks');
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * 2 * Math.PI;
      const major = i % 3 === 0;
      const r1 = major ? 76 : 79, r2 = 84;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', 100 + r1 * Math.cos(a)); line.setAttribute('y1', 100 + r1 * Math.sin(a));
      line.setAttribute('x2', 100 + r2 * Math.cos(a)); line.setAttribute('y2', 100 + r2 * Math.sin(a));
      if (major) line.classList.add('major');
      g.appendChild(line);
    }
  })();

  // startMin분 위치부터 lenMin분 길이의 호를 그린다 (0분 = 12시 방향)
  const PER_MIN = CIRC / 60;
  const GAP = 0.5;  // 몰입 호와 쉬는 시간 호 사이 틈 (분)
  function setArc(id, color, startMin, lenMin) {
    const el = $(id);
    el.classList.remove('c-focus', 'c-break', 'c-meal');
    el.classList.add(color);
    if (lenMin <= 0) { el.style.opacity = 0; return; }
    el.style.opacity = '';
    el.style.strokeDasharray = `${lenMin * PER_MIN} ${CIRC}`;
    el.style.strokeDashoffset = `${-startMin * PER_MIN}`;
  }
  const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

  function drawRing(d, st) {
    const m = d.getMinutes() + d.getSeconds() / 60;  // 이 시간의 몇 분째인지
    const inHour = st.type === 'focus' || st.type === 'break' || st.type === 'meal';
    if (st.type === 'meal') {
      setArc('trackA', 'c-meal', GAP, 60 - 2 * GAP);
      setArc('trackB', 'c-meal', 0, 0);
      setArc('fillA', 'c-meal', GAP, clamp(m - GAP, 0, 60 - 2 * GAP));
      setArc('fillB', 'c-meal', 0, 0);
      return;
    }
    // 몰입 0~50분(초록), 쉬는 시간 50~60분(주황)
    setArc('trackA', 'c-focus', GAP, FOCUS_MIN - 2 * GAP);
    setArc('trackB', 'c-break', FOCUS_MIN + GAP, 60 - FOCUS_MIN - 2 * GAP);
    setArc('fillA', 'c-focus', GAP, inHour ? clamp(m - GAP, 0, FOCUS_MIN - 2 * GAP) : 0);
    setArc('fillB', 'c-break', FOCUS_MIN + GAP, inHour ? clamp(m - FOCUS_MIN - GAP, 0, 60 - FOCUS_MIN - 2 * GAP) : 0);
  }

  function tick() {
    const d = now();
    const st = getState(d);
    const hh = d.getHours();
    $('clock').textContent = `${dateLabel(d)}  ${hh < 12 ? '오전' : '오후'} ${hh % 12 || 12}:${pad(d.getMinutes())}`;
    $('phase').textContent = st.phase;
    const html = st.remain == null ? '' : remainHtml(st);
    if ($('remain').innerHTML !== html) $('remain').innerHTML = html;
    $('sub').textContent = st.sub;
    $('rule').textContent = st.rule;
    ['focus', 'break', 'meal'].forEach(c => document.body.classList.toggle(c, st.type === c));
    document.body.classList.toggle('idle', !st.type);

    // 원 = 한 시간. 지금 몇 분인지만큼 12시 방향에서 시계방향으로 채워짐
    drawRing(d, st);

    document.querySelectorAll('.slot').forEach(el => {
      const h = Number(el.dataset.hour);
      const isNow = st.hour === h && (st.type === 'focus' || st.type === 'meal');
      const isDone = st.key === 'after' || (st.hour != null && (h < st.hour || (h === st.hour && st.type === 'break')));
      el.classList.toggle('now', isNow);
      el.classList.toggle('done', isDone);
    });

    document.title = st.remain == null ? '리드스테이' : `${remainText(st)} · ${st.phase}`;

    // 다음 종을 미리 예약 (전환 시각까지 LOOKAHEAD초 이내가 되면 한 번만)
    if (ctx && !muted) {
      // 절전·장치 변경 등으로 오디오가 멈췄으면 다시 깨움
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      const nx = nextTransition(d);
      const delay = nx.at - secOfDay(d);
      const key = `${d.toDateString()}-${nx.key}`;
      if (delay <= LOOKAHEAD && scheduledKey !== key) {
        if (nx.bell) playBell(nx.bell, delay);
        scheduledKey = key;
      }
    }
  }

  tick();
  setInterval(tick, 250);

  // ---- 시작 화면 ----
  $('overlay').addEventListener('click', () => {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    $('overlay').remove();
    keepAwake();
  });

  // ---- 설정 팝업 ----
  const settings = $('settings');
  const openSettings = () => { fillScheduleForm(); settings.hidden = false; $('btnClose').focus(); };
  const closeSettings = () => { settings.hidden = true; $('btnSettings').focus(); };
  $('btnSettings').onclick = openSettings;
  $('btnClose').onclick = closeSettings;
  settings.addEventListener('click', e => { if (e.target === settings) closeSettings(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !settings.hidden) closeSettings(); });

  $('btnTestStart').onclick = () => playBell(START_BELL);
  $('btnTestEnd').onclick = () => playBell(BREAK_BELL);

  const volInput = $('volume');
  const showVolume = () => { $('volumeOut').textContent = `${volInput.value}%`; };
  volInput.value = Math.round(volume * 100);
  showVolume();
  volInput.addEventListener('input', () => {
    volume = Number(volInput.value) / 100;
    showVolume();
    try { localStorage.setItem('readstay-volume', volInput.value); } catch (e) {}
  });
  // 볼륨을 바꾸면 이미 예약된 종은 새 볼륨으로 다시 예약
  volInput.addEventListener('change', () => { if (pending.length) stopAllBells(); });

  $('btnMute').onclick = e => {
    muted = !muted;
    if (muted) stopAllBells();
    e.currentTarget.textContent = muted ? '🔇 종소리 꺼짐' : '🔊 종소리 켜짐';
    e.currentTarget.classList.toggle('off', muted);
  };
  // ---- 행사 일정 설정 ----
  const MEAL_NAMES = ['아침', '점심', '저녁', '식사'];
  const hourOpts = (from, to, sel) => {
    let html = '';
    for (let h = from; h <= to; h++) html += `<option value="${h}"${h === sel ? ' selected' : ''}>${pad(h)}:00</option>`;
    return html;
  };
  function mealRow(meal) {
    const row = document.createElement('div');
    row.className = 'meal-row';
    row.innerHTML = `
      <select class="meal-name" aria-label="식사 이름">${MEAL_NAMES.map(n => `<option${n === meal.name ? ' selected' : ''}>${n}</option>`).join('')}</select>
      <select class="meal-hour" aria-label="식사 시작 시각">${hourOpts(5, 23, meal.hour)}</select>
      <span class="until">~ ${pad(meal.hour + 1)}:00</span>
      <button type="button" aria-label="이 식사 시간 삭제">삭제</button>`;
    row.querySelector('.meal-hour').addEventListener('change', e => {
      row.querySelector('.until').textContent = `~ ${pad(Number(e.target.value) + 1)}:00`;
    });
    row.querySelector('button').onclick = () => { row.remove(); showEmptyMeals(); };
    return row;
  }
  function showEmptyMeals() {
    const box = $('cfgMeals');
    const empty = box.querySelector('.empty');
    const hasRows = box.querySelector('.meal-row');
    if (!hasRows && !empty) box.insertAdjacentHTML('beforeend', '<div class="empty">없음 (계속 몰입)</div>');
    if (hasRows && empty) empty.remove();
  }
  function fillScheduleForm() {
    $('cfgDate').value = cfg.date || '';
    $('cfgStart').innerHTML = hourOpts(5, 22, cfg.start);
    $('cfgEnd').innerHTML = hourOpts(6, 24, cfg.end);
    const box = $('cfgMeals');
    box.innerHTML = '';
    [...cfg.meals].sort((a, b) => a.hour - b.hour).forEach(m => box.appendChild(mealRow(m)));
    showEmptyMeals();
    $('cfgMsg').textContent = '';
  }
  function readScheduleForm() {
    const next = {
      date: $('cfgDate').value,
      start: Number($('cfgStart').value),
      end: Number($('cfgEnd').value),
      meals: [...document.querySelectorAll('#cfgMeals .meal-row')].map(r => ({
        name: r.querySelector('.meal-name').value,
        hour: Number(r.querySelector('.meal-hour').value),
      })),
    };
    if (next.end <= next.start) return { error: '끝나는 시각이 시작 시각보다 늦어야 해요.' };
    const hours = next.meals.map(m => m.hour);
    if (new Set(hours).size !== hours.length) return { error: '같은 시각에 식사 시간이 두 번 들어가 있어요.' };
    const outside = next.meals.find(m => m.hour < next.start || m.hour >= next.end);
    if (outside) return { error: `${outside.name} ${pad(outside.hour)}:00이 행사 시간(${pad(next.start)}:00~${pad(next.end)}:00) 밖이에요.` };
    if (next.end - next.start - next.meals.length < 1) return { error: '몰입 시간이 하나도 없어요. 식사 시간을 줄여주세요.' };
    return { cfg: next };
  }
  $('cfgDateClear').onclick = () => { $('cfgDate').value = ''; };
  $('cfgAddMeal').onclick = () => {
    const used = new Set([...document.querySelectorAll('#cfgMeals .meal-hour')].map(s => Number(s.value)));
    const start = Number($('cfgStart').value), end = Number($('cfgEnd').value);
    let hour = 18;
    if (used.has(hour) || hour < start || hour >= end) {
      for (let h = start; h < end; h++) if (!used.has(h)) { hour = h; break; }
    }
    $('cfgMeals').appendChild(mealRow({ name: hour >= 16 ? '저녁' : hour < 11 ? '아침' : '점심', hour }));
    showEmptyMeals();
  };
  $('cfgApply').onclick = () => {
    const r = readScheduleForm();
    const msg = $('cfgMsg');
    if (r.error) { msg.textContent = r.error; msg.className = 'msg err'; return; }
    cfg = r.cfg;
    try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
    computeSessions();
    buildTimetable();
    stopAllBells();  // 예약된 종을 지우고 새 일정으로 다시 예약
    tick();
    msg.textContent = '적용했어요.';
    msg.className = 'msg ok';
  };
  fillScheduleForm();

  document.addEventListener('fullscreenchange', () => {
    const full = !!document.fullscreenElement;
    $('btnFull').title = $('btnFull').ariaLabel = full ? '전체화면 끄기' : '전체화면';
  });
  $('btnFull').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else document.documentElement.requestFullscreen?.().catch(() => {});
  };
})();
</script>
</body>
</html>

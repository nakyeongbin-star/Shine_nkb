<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리드스테이 타이머</title>
<style>
  :root {
    --bg: #f3f8f2;
    --fg: #1f2d26;
    --muted: #6b8078;
    --accent: #2e9d63;
    --ring-bg: rgba(46, 157, 99, 0.12);
    --card: #ffffff;
    --line: rgba(31, 45, 38, 0.08);
  }
  body.break { --bg: #fdf5e9; --fg: #3a2c1a; --muted: #8f7658; --accent: #e08a1e; --ring-bg: rgba(224, 138, 30, 0.14); --line: rgba(58, 44, 26, 0.08); }
  body.idle  { --bg: #f2f4f9; --fg: #232838; --muted: #737a90; --accent: #5669b0; --ring-bg: rgba(86, 105, 176, 0.12); --line: rgba(35, 40, 56, 0.08); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    min-width: 1024px;
    padding: 4vh 40px 3vh;
    transition: background 1.2s ease, color 1.2s ease;
    overflow: hidden;
  }

  header { text-align: center; }
  .brand { font-size: 2.4vh; font-weight: 700; letter-spacing: 0.45em; color: var(--accent); }
  .clock { font-size: 3.6vh; font-variant-numeric: tabular-nums; margin-top: 0.2em; color: var(--muted); }

  main { display: flex; flex-direction: column; align-items: center; gap: 3vh; }
  .ring-wrap {
    position: relative; width: 58vh; aspect-ratio: 1;
    border-radius: 50%;
    background: var(--card);
    box-shadow: 0 2vh 6vh rgba(0, 0, 0, 0.07);
  }
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { stroke: var(--ring-bg); }
  .ring-fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 0.3s linear, stroke 1.2s; }
  .ring-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .phase { font-size: 4.4vh; font-weight: 700; color: var(--accent); }
  .remain { font-size: 15vh; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .remain .unit { font-size: 0.4em; font-weight: 400; margin-left: 0.08em; color: var(--muted); }
  .sub { font-size: 2.4vh; color: var(--muted); margin-top: 0.4em; }

  .rule {
    font-size: 2.8vh;
    padding: 0.6em 1.6em;
    border-radius: 999px;
    background: var(--card);
    box-shadow: 0 0.5vh 2vh rgba(0, 0, 0, 0.05);
    text-align: center;
  }

  .timetable { display: flex; gap: 8px; justify-content: center; }
  .slot {
    font-size: 1.6vh;
    padding: 0.5em 1em;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    text-align: center;
  }
  .slot b { display: block; font-size: 1.1em; color: var(--fg); }
  .slot.done { opacity: 0.4; }
  .slot.now { background: var(--accent); border-color: var(--accent); color: #fff; }
  .slot.now b { color: #fff; }

  .controls { display: flex; justify-content: center; gap: 8px; margin-top: 1.5vh; opacity: 0.3; transition: opacity 0.3s; }
  .controls:hover, .controls:focus-within { opacity: 1; }
  .controls button {
    background: var(--card); color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 0.5em 1em; font: inherit; font-size: 14px; cursor: pointer;
  }

  #overlay {
    position: fixed; inset: 0;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(6px);
    color: #1f2d26;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; cursor: pointer; text-align: center;
  }
  #overlay h1 { font-size: 64px; }
  #overlay p { color: #6b8078; font-size: 20px; line-height: 1.6; }
  #overlay .go {
    background: #2e9d63; color: #fff; font-weight: 700;
    padding: 0.8em 2.2em; border-radius: 999px; font-size: 24px;
    box-shadow: 0 8px 24px rgba(46, 157, 99, 0.3);
  }
  body.ringing .ring-wrap { animation: pulse 1s ease-in-out 4; }
  @keyframes pulse { 50% { transform: scale(1.03); } }
</style>
</head>
<body class="idle">

<header>
  <div class="brand">READ · STAY</div>
  <div class="clock" id="clock">--:--</div>
</header>

<main>
  <div class="ring-wrap">
    <svg viewBox="0 0 200 200">
      <circle class="ring-bg" cx="100" cy="100" r="92" fill="none" stroke-width="6"/>
      <circle class="ring-fg" id="ring" cx="100" cy="100" r="92" fill="none" stroke-width="6"
              stroke-dasharray="578.05" stroke-dashoffset="0"/>
    </svg>
    <div class="ring-center">
      <div class="phase" id="phase">-</div>
      <div class="remain" id="remain"></div>
      <div class="sub" id="sub"></div>
    </div>
  </div>
  <div class="rule" id="rule"></div>
</main>

<footer>
  <div class="timetable" id="timetable"></div>
  <div class="controls">
    <button id="btnTestStart">🔔 시작종 듣기</button>
    <button id="btnTestEnd">🔔 쉬는종 듣기</button>
    <button id="btnMute">🔊 소리 켜짐</button>
    <button id="btnFull">⛶ 전체화면</button>
  </div>
</footer>

<div id="overlay">
  <h1>📚 리드스테이</h1>
  <p>매 정각 몰입 시작 · 50분 쉬는 시간<br>종소리를 울리려면 화면을 한 번 눌러주세요</p>
  <div class="go">시작하기</div>
</div>

<script>
(() => {
  // ---- 설정 (URL 파라미터로 변경 가능: ?start=9&end=18&focus=50) ----
  const params = new URLSearchParams(location.search);
  const START_HOUR = Number(params.get('start') ?? 9);
  const END_HOUR = Number(params.get('end') ?? 18);
  const FOCUS_MIN = Number(params.get('focus') ?? 50);

  // 테스트용: ?t=08:59:50 처럼 주면 그 시각부터 시계가 흐름
  let offsetMs = 0;
  if (params.get('t')) {
    const [h, m, s = 0] = params.get('t').split(':').map(Number);
    const target = new Date();
    target.setHours(h, m, s, 0);
    offsetMs = target - Date.now();
  }
  const now = () => new Date(Date.now() + offsetMs);

  // ---- 교시 계산 ----
  function getState(d) {
    const h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
    const secOfDay = h * 3600 + m * 60 + s + d.getMilliseconds() / 1000;
    const startSec = START_HOUR * 3600, endSec = END_HOUR * 3600;

    if (secOfDay < startSec) {
      return { key: 'before', phase: '시작 전', remain: startSec - secOfDay, total: null,
               sub: `${pad(START_HOUR)}:00 첫 몰입 시작`, rule: '곧 리드스테이가 시작됩니다' };
    }
    if (secOfDay >= endSec) {
      return { key: 'after', phase: '오늘의 리드스테이 종료', remain: null, total: null,
               sub: '함께 머물러 주셔서 고맙습니다', rule: '다음에 또 만나요 👋' };
    }
    const period = h - START_HOUR + 1;
    const secInHour = m * 60 + s + d.getMilliseconds() / 1000;
    const focusSec = FOCUS_MIN * 60;
    if (secInHour < focusSec) {
      return { key: `focus-${period}`, type: 'focus', period, phase: `${period}교시 몰입`,
               remain: focusSec - secInHour, total: focusSec,
               sub: `${pad(h)}:${pad(FOCUS_MIN)} 까지`,
               rule: '🤫 말소리 없이 몰입 중 · 출입은 조용히 자유롭게' };
    }
    const last = h + 1 >= END_HOUR;
    return { key: `break-${period}`, type: 'break', period, phase: '쉬는 시간',
             remain: 3600 - secInHour, total: 3600 - focusSec,
             sub: last ? `${pad(h + 1)}:00 종료` : `${pad(h + 1)}:00 ${period + 1}교시 시작`,
             rule: '☕ 스트레칭 · 물 한 잔 · 대화는 공간 밖에서' };
  }

  const pad = n => String(Math.floor(n)).padStart(2, '0');
  // 남은 시간을 차분하게 표시: 분 단위(1분에 한 번만 바뀜).
  // 초는 쉬는 시간 마지막 1분에만 보여준다 (곧 시작한다는 준비 신호).
  function remainParts(st) {
    const sec = Math.ceil(st.remain);
    if (st.type === 'break' && sec <= 60) return [[sec, '초']];
    const min = Math.ceil(sec / 60);
    if (min >= 60) {
      const h = Math.floor(min / 60), m = min % 60;
      return m ? [[h, '시간'], [m, '분']] : [[h, '시간']];
    }
    return [[min, '분']];
  }
  const remainText = st => remainParts(st).map(([n, u]) => n + u).join(' ');
  const remainHtml = st => remainParts(st).map(([n, u]) => `${n}<span class="unit">${u}</span>`).join(' ');

  // ---- 종소리 (Web Audio로 합성, 외부 파일 없음) ----
  let ctx = null, muted = false;
  const NOTE = { G4: 392.0, C5: 523.25, D5: 587.33, E5: 659.25 };
  // 학교종 "딩동댕동" (웨스트민스터 차임)
  const START_BELL = ['E5', 'C5', 'D5', 'G4', null, 'G4', 'D5', 'E5', 'C5'];
  const BREAK_BELL = ['C5', 'E5', 'D5', 'G4', null, 'G4', 'D5', 'E5', 'C5'];
  const END_BELL = ['E5', 'C5', 'D5', 'G4', null, 'G4', 'D5', 'E5', 'C5', null, 'C5'];

  let pending = [];  // 예약된 종소리 노드 (음소거 시 끊기 위해 보관)

  function strike(freq, t) {
    const master = ctx.createGain();
    master.connect(ctx.destination);
    pending.push(master);
    master.gain.setValueAtTime(0.0001, t);
    master.gain.exponentialRampToValueAtTime(0.35, t + 0.01);
    master.gain.exponentialRampToValueAtTime(0.0001, t + 2.8);
    // 종 특유의 배음
    [[1, 1], [2, 0.5], [2.76, 0.25], [5.4, 0.12]].forEach(([ratio, amp]) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq * ratio;
      g.gain.value = amp;
      osc.connect(g).connect(master);
      osc.start(t);
      osc.stop(t + 3);
    });
  }

  // delaySec 뒤에 울리도록 오디오 시계에 미리 예약한다.
  // 오디오 시계는 탭이 백그라운드여도 느려지지 않아서 종이 정확한 시각에 울린다.
  function playBell(seq, delaySec = 0) {
    if (!ctx || muted) return;
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    let t = ctx.currentTime + Math.max(delaySec, 0) + 0.05;
    seq.forEach(n => {
      if (n) strike(NOTE[n], t);
      t += 0.75;
    });
    setTimeout(() => {
      document.body.classList.add('ringing');
      setTimeout(() => document.body.classList.remove('ringing'), 4000);
    }, Math.max(delaySec, 0) * 1000);
    // 다 울린 노드는 목록에서 정리
    const mine = pending.slice(-seq.filter(Boolean).length);
    setTimeout(() => { pending = pending.filter(g => !mine.includes(g)); }, (t + 3 - ctx.currentTime) * 1000);
  }

  function stopAllBells() {
    pending.forEach(g => g.disconnect());
    pending = [];
    scheduledKey = null;
  }

  // ---- 화면 꺼짐 방지 ----
  let wakeLock = null;
  async function keepAwake() {
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && wakeLock !== null) keepAwake();
  });

  // ---- 시간표 ----
  const tt = document.getElementById('timetable');
  for (let h = START_HOUR; h < END_HOUR; h++) {
    const el = document.createElement('div');
    el.className = 'slot';
    el.dataset.period = h - START_HOUR + 1;
    el.innerHTML = `<b>${h - START_HOUR + 1}교시</b>${h}:00–${h}:${pad(FOCUS_MIN)}`;
    tt.appendChild(el);
  }

  // ---- 렌더 루프 ----
  const $ = id => document.getElementById(id);
  const CIRC = 2 * Math.PI * 92;
  let scheduledKey = null;
  const LOOKAHEAD = 70;  // 초. 백그라운드 탭은 타이머가 최대 1분 늦게 돌 수 있어 넉넉히 미리 예약

  // 다음 상태 전환 시각과 그때 울릴 종을 계산
  function nextTransition(d) {
    const secOfDay = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds() + d.getMilliseconds() / 1000;
    const startSec = START_HOUR * 3600, endSec = END_HOUR * 3600;
    if (secOfDay < startSec) return { at: startSec, key: `focus-1`, bell: START_BELL };
    if (secOfDay >= endSec) return { at: 86400 + startSec, key: 'focus-1-next', bell: START_BELL };
    const hourStart = d.getHours() * 3600;
    const focusEnd = hourStart + FOCUS_MIN * 60;
    const period = d.getHours() - START_HOUR + 1;
    if (secOfDay < focusEnd) return { at: focusEnd, key: `break-${period}`, bell: BREAK_BELL };
    const nextHour = hourStart + 3600;
    if (nextHour >= endSec) return { at: nextHour, key: 'after', bell: END_BELL };
    return { at: nextHour, key: `focus-${period + 1}`, bell: START_BELL };
  }

  function tick() {
    const d = now();
    const st = getState(d);
    $('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    $('phase').textContent = st.phase;
    const html = st.remain == null ? '' : remainHtml(st);
    if ($('remain').innerHTML !== html) $('remain').innerHTML = html;
    $('sub').textContent = st.sub;
    $('rule').textContent = st.rule;
    document.body.classList.toggle('focus', st.type === 'focus');
    document.body.classList.toggle('break', st.type === 'break');
    document.body.classList.toggle('idle', !st.type);

    const progress = st.total ? st.remain / st.total : (st.key === 'after' ? 0 : 1);
    $('ring').style.strokeDashoffset = CIRC * (1 - progress);

    document.querySelectorAll('.slot').forEach(el => {
      const p = Number(el.dataset.period);
      el.classList.toggle('now', st.period === p && st.type === 'focus');
      el.classList.toggle('done', st.key === 'after' || (!!st.period && (p < st.period || (p === st.period && st.type === 'break'))));
    });

    document.title = st.remain == null ? '리드스테이' : `${remainText(st)} · ${st.phase}`;

    // 다음 종을 미리 예약 (전환 시각까지 LOOKAHEAD초 이내가 되면 한 번만)
    if (ctx && !muted) {
      // 절전·장치 변경 등으로 오디오가 멈췄으면 다시 깨움
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      const nx = nextTransition(d);
      const secOfDay = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds() + d.getMilliseconds() / 1000;
      const delay = nx.at - secOfDay;
      const key = `${d.toDateString()}-${nx.key}`;
      if (delay <= LOOKAHEAD && scheduledKey !== key) {
        playBell(nx.bell, delay);
        scheduledKey = key;
      }
    }
  }

  tick();
  setInterval(tick, 250);

  // ---- 컨트롤 ----
  $('overlay').addEventListener('click', () => {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    $('overlay').remove();
    keepAwake();
  });
  $('btnTestStart').onclick = () => playBell(START_BELL);
  $('btnTestEnd').onclick = () => playBell(BREAK_BELL);
  $('btnMute').onclick = e => {
    muted = !muted;
    if (muted) stopAllBells();
    e.currentTarget.textContent = muted ? '🔇 소리 꺼짐' : '🔊 소리 켜짐';
  };
  $('btnFull').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else document.documentElement.requestFullscreen?.().catch(() => {});
  };
})();
</script>
</body>
</html>
